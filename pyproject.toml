[project]
name = "trd-platform"
version = "0.1.0"
description = "Paper-first autonomous trading orchestration foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "structlog==26.1.0",
  "httpx==0.28.1",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "pip-audit>=2.9,<3",
  "PyYAML>=6.0,<7",
  "httpx2==2.13.1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "apps"]
exclude = ["apps/dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = ["integration: requires an explicitly configured isolated PostgreSQL test server"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["apps/dashboard", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = "==0.12.22"
