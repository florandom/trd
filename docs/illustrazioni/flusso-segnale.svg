<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Come TRD tratta un segnale</title><desc id="desc">Telegram autorizzato, raccolta, interpretazione rigorosa, agenti consultivi e dashboard. Rischio, bridge firmato e logica MQL5 simulata sono verificati in laboratorio. Compilazione nativa, terminale e broker restano da collaudare.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708399"/></marker></defs><rect width="1200" height="610" rx="24" fill="#f4f7fa"/><g font-family="Arial, sans-serif"><text x="24" y="38" font-size="20" fill="#23324a" font-weight="700">PERCORSO ATTUALE  ·  Dopo configurazione e attivazione esplicite</text><rect x="24" y="80" width="216" height="140" rx="18" fill="#eef6fc" stroke="#d8e2ea" stroke-width="2"/><text x="44" y="118" font-size="23" fill="#23324a" font-weight="700">1  Telegram</text><text x="44" y="154" font-size="20" fill="#23324a" font-weight="400">Fonti autorizzate</text><text x="44" y="183" font-size="20" fill="#23324a" font-weight="400">Account collegato</text><path d="M 240 150 H 252" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="258" y="80" width="216" height="140" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="278" y="118" font-size="23" fill="#23324a" font-weight="700">2  Raccolta</text><text x="278" y="154" font-size="20" fill="#23324a" font-weight="400">Salva e deduplica</text><text x="278" y="183" font-size="20" fill="#23324a" font-weight="400">Conserva revisioni</text><path d="M 474 150 H 486" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="492" y="80" width="216" height="140" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="512" y="118" font-size="23" fill="#23324a" font-weight="700">3  Interpretazione</text><text x="512" y="154" font-size="20" fill="#23324a" font-weight="400">Segnale completo?</text><text x="512" y="183" font-size="20" fill="#23324a" font-weight="400">Recente e iniziale?</text><path d="M 708 150 H 720" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="726" y="80" width="216" height="140" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="746" y="118" font-size="23" fill="#23324a" font-weight="700">4  Agenti IA</text><text x="746" y="154" font-size="20" fill="#23324a" font-weight="400">Analisi e decisione</text><text x="746" y="183" font-size="20" fill="#23324a" font-weight="400">Critica se prevista</text><path d="M 942 150 H 954" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="960" y="80" width="216" height="140" rx="18" fill="#eef6fc" stroke="#d8e2ea" stroke-width="2"/><text x="980" y="118" font-size="23" fill="#23324a" font-weight="700">5  Dashboard</text><text x="980" y="154" font-size="20" fill="#23324a" font-weight="400">Esiti e motivi</text><text x="980" y="183" font-size="20" fill="#23324a" font-weight="400">Proposte e costi</text><path d="M 600 220 V 260" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="352" y="272" width="496" height="96" rx="18" fill="#fff3de" stroke="#e3bb74" stroke-width="2"/><text x="372" y="310" font-size="23" fill="#23324a" font-weight="700">Si ferma se non supera i controlli</text><text x="372" y="346" font-size="20" fill="#23324a" font-weight="400">Ignorato, scaduto, revisione o rifiuto</text><text x="612" y="252" font-size="18" fill="#23324a" font-weight="400">No</text><path d="M 848 320 H 1068 V 226" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><text x="26" y="410" font-size="23" fill="#7a4d12" font-weight="700">NESSUN ORDINE REALE  ·  Rischio ed esecuzione simulata verificati in locale.</text><text x="26" y="454" font-size="20" fill="#596a80" font-weight="700">LABORATORIO VERIFICATO  ·  Bridge MQL5 in sorgente; terminale da collaudare</text><rect x="24" y="482" width="350" height="100" rx="18" fill="#eef6fc" stroke="#d8e2ea" stroke-width="2"/><text x="44" y="520" font-size="23" fill="#23324a" font-weight="700">Rischio locale</text><text x="44" y="556" font-size="20" fill="#23324a" font-weight="400">Prenotazioni e controlli</text><rect x="425" y="482" width="350" height="100" rx="18" fill="#eef6fc" stroke="#d8e2ea" stroke-width="2"/><text x="445" y="520" font-size="23" fill="#23324a" font-weight="700">Bridge e EA locale</text><text x="445" y="556" font-size="20" fill="#23324a" font-weight="400">Ordini, stop e chiusure simulate</text><rect x="826" y="482" width="350" height="100" rx="18" fill="#f4f7fa" stroke="#b1bdc9" stroke-width="2" stroke-dasharray="8 6"/><text x="846" y="520" font-size="23" fill="#23324a" font-weight="700">Terminale e broker reale</text><text x="846" y="556" font-size="20" fill="#23324a" font-weight="400">Collaudo nativo e demo futuri</text><path d="M 378 532 H 416" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 779 532 H 816" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/></g></svg>