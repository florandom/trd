<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Componenti e responsabilità di TRD</title><desc id="desc">Dashboard e API autenticate, PostgreSQL e processi separati per Telegram, IA e manutenzione. Credenziali separate. Bridge e adattatore ordini MT5 verificati in simulazione; terminale nativo, account esterni e avvisi restano da collaudare.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708399"/></marker></defs><rect width="1200" height="500" rx="24" fill="#f4f7fa"/><g font-family="Arial, sans-serif"><text x="24" y="38" font-size="21" fill="#23324a" font-weight="700">ARCHITETTURA  ·  La dashboard controlla, i processi persistenti elaborano</text><rect x="24" y="80" width="348" height="118" rx="18" fill="#eef6fc" stroke="#d8e2ea" stroke-width="2"/><text x="44" y="118" font-size="23" fill="#23324a" font-weight="700">Dashboard italiana</text><text x="44" y="154" font-size="20" fill="#23324a" font-weight="400">Locale oggi; Vercel predisposto</text><text x="44" y="183" font-size="20" fill="#23324a" font-weight="400">Utenti ADMIN e VIEWER</text><rect x="430" y="80" width="326" height="118" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="450" y="118" font-size="23" fill="#23324a" font-weight="700">API autenticata</text><text x="450" y="154" font-size="20" fill="#23324a" font-weight="400">Sessioni, ruoli e conferme</text><text x="450" y="183" font-size="20" fill="#23324a" font-weight="400">Remoto con Access e MFA</text><rect x="814" y="80" width="362" height="118" rx="18" fill="#eef6fc" stroke="#d8e2ea" stroke-width="2"/><text x="834" y="118" font-size="23" fill="#23324a" font-weight="700">PostgreSQL</text><text x="834" y="154" font-size="20" fill="#23324a" font-weight="400">Stato, versioni e audit</text><text x="834" y="183" font-size="20" fill="#23324a" font-weight="400">Ruoli e credenziali distinti</text><path d="M 378 139 H 420" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 762 139 H 804" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="24" y="270" width="348" height="118" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="44" y="308" font-size="23" fill="#23324a" font-weight="700">Collector Telegram</text><text x="44" y="344" font-size="20" fill="#23324a" font-weight="400">Account e sessione cifrata</text><text x="44" y="373" font-size="20" fill="#23324a" font-weight="400">Solo fonti autorizzate</text><rect x="430" y="270" width="326" height="118" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="450" y="308" font-size="23" fill="#23324a" font-weight="700">Worker IA</text><text x="450" y="344" font-size="20" fill="#23324a" font-weight="400">Simulatore oggi</text><text x="450" y="373" font-size="20" fill="#23324a" font-weight="400">OpenRouter dopo collaudo</text><rect x="814" y="270" width="362" height="118" rx="18" fill="#ffffff" stroke="#d8e2ea" stroke-width="2"/><text x="834" y="308" font-size="23" fill="#23324a" font-weight="700">Manutenzione</text><text x="834" y="344" font-size="20" fill="#23324a" font-weight="400">Pulizia a lotti manuale</text><text x="834" y="373" font-size="20" fill="#23324a" font-weight="400">Credenziale dedicata</text><path d="M 198 264 V 230 H 995 V 204" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 593 264 V 230" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 995 264 V 204" fill="none" stroke="#708399" stroke-width="2.5" marker-end="url(#arrow)"/><text x="25" y="434" font-size="22" fill="#23324a" font-weight="400">Il backend resta persistente su Windows o Linux. Il bridge resta isolato.</text><text x="25" y="472" font-size="22" fill="#7a4d12" font-weight="700">Adattatore MT5 simulato. Terminale, broker e avvisi restano da collaudare.</text></g></svg>